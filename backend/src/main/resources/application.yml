spring:
  application:
    name: healthcare-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthcare}
    username: ${DB_USERNAME:healthcare}
    password: ${DB_PASSWORD:healthcare_dev_only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: 8080
